# Build the FastAPI Docker image with the latest released model baked in,
# and publish it to GitHub Container Registry (ghcr.io).
#
# Runs after "Train model" succeeds (new model) or when the API code changes.

name: Build image

on:
  workflow_run:
    workflows: ["Train model"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "api/**"
      - "Dockerfile"
      - "requirements-api.txt"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    # After a training run, only build if training succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Find latest model release
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName); then
            echo "Using model $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No model release yet. Run the 'Train model' workflow first; skipping image build."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.model.outputs.found == 'true'

      - uses: docker/login-action@v4
        if: steps.model.outputs.found == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        if: steps.model.outputs.found == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.model.outputs.tag }}
            type=sha

      - name: Build and push
        if: steps.model.outputs.found == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_URL=https://github.com/${{ github.repository }}/releases/download/${{ steps.model.outputs.tag }}
            MODEL_VERSION=${{ steps.model.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
